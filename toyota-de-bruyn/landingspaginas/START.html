<footer class=\"site-footer\"><strong>Toyota De Bruyn · Machelen<\/strong><a href=\"index.html\">Overzicht<\/a><span>Geen tracking of verzending van contactaanvragen in deze proef.<\/span><\/footer><script type=\"application/json\" id=\"variant-data\">[[\"Werkdag én rekening\", \"Je wagen moet je werk vooruithelpen. Niet je vragen vergroten.\", \"Vergelijk aandrijving, laadplan en kosten. Met een aparte route voor eenmanszaak en vennootschap.\"], [\"Totaalbeeld\", \"Een goed aftrekpercentage rijdt je klanten niet rond.\", \"Kies een wagen die praktisch werkt en laat de volledige rekening doorrekenen.\"], [\"Rust\", \"Minder losse aannames. Een beter wagenplan.\", \"Breng garage en accountant samen rond dezelfde ritten, bedragen en voertuiggegevens.\"], [\"Continuïteit\", \"Je zaak draait. Je mobiliteit moet mee.\", \"Van klantbezoek tot laadmoment: vergelijk wat je onderneming elke dag nodig heeft.\"], [\"Zelfstandige\", \"Je bent ondernemer. Niet automatisch een vennootschap.\", \"Ontdek waarom dat verschil telt wanneer je een hybride of elektrische wagen kiest.\"], [\"Beslissen\", \"Eerst je werkdag. Dan de wagen. Dan de rekensom.\", \"Een zakelijke keuze wordt sterker wanneer praktische en fiscale vragen niet door elkaar lopen.\"]]<\/script>"}, "assets": {"assets/hero.webp": "data:image/webp;base64,UklGRl4wAABXRUJQVlA4IFIwAADwVwGdASqAAuABPrlUplAnJDA0onA58pAXCWduCuBen9W/ztao3qhnLIHKyAK02KRx3cOch7mz6/9fO+F6ZT+64gPzwMxf/YeJ9Mqd/CKWNqPfY45l/7bH+RBw9/mP/q873y//T7XX57/v/2Hu/WK+IH/M5WmdTzlld56gzxi2UebMp/8+mv7u9NUXxI94rFySf1KRUwmaS5F9VJzgLXzVH/OP/BDsVi5JP6q9Q/25Aavp7EU1N7HNHGEZsMC6AfOmjWBPixOE6kd6cfv94tUUQaZLNAN9BSVYlXIJ/VobsPMQ0+Uv7KELBXF+Ez4FhICKCUQTBXs19cGeDOynH7VHFXnstUST1JH6L+D+muWy4ogUbbgp1ttg45yzL8Z3TvNtZKbnRCgcTkrI/94nK2hpRPbxeV1LnyWrr9vZf3NQOTBfEYmKLNa6T6tPWmB+5zi5JP6rD84YgQtQOq+Q06cAzlDx6mFKQGWZ3Sn/1U6h/vFYuXELaAu0//ZGZlKvon2EFoJmTaRgU9ytvbD5Y0SHHKJRd468fs0Pbq6Kes3+sQnfdVO5l6gKCg1TISGiEywOECsKoNp9DLS/XLqVwO/xofxbsSgvr3C7V4M0o5j0HbczyG8rqqaWryTErr7BOXBuWgkv0vuP/ den=\"true\" style=\"width:'+n/max*100+'%\"><\/span><\/div>').join('')+'<\/div><p><strong>Alleen energie, geen totale wagenkost.<\/strong> Het PHEV-scenario veronderstelt '+dec(v.share,0)+'% elektrische kilometers. Bereken ook met 0% om het scenario zonder laden te zien.<\/p>';});stale(energy,'energy-result');energy.addEventListener('reset',()=>{$('energy-result').replaceChildren();});}\nconst phev=$('phev-form');\nif(phev){phev.addEventListener('submit',e=>{e.preventDefault();const a=$('habit').value,b=$('trip').value;const msg=a==='regular'?['Een laadbare week is een goed vertrekpunt.','Vergelijk hoeveel van je ritten binnen de praktische elektrische mogelijkheden vallen en of de meerprijs past. Een laadplek alleen maakt een PHEV nog niet automatisch de beste keuze.']:a==='public'?['Toets eerst je publieke laadritme.','Controleer beschikbaarheid, totale prijs en parkeertijd op de uren dat jij er bent. Vergelijk ook een EV met dezelfde laadplek en een full hybrid zonder externe laadbeurt.']:['Vergelijk bewust ook zonder stekker.','Als je zelden laadt, benut je de extern geladen elektrische kilometers weinig. Zet full hybrid naast de PHEV en bekijk of een EV-laadplan later haalbaar wordt.'];$('phev-result').innerHTML='<h3>'+msg[0]+'<\/h3><p>'+msg[1]+'<\/p><p>'+(b==='variable'?'Je ritten wisselen sterk: reken naast een gewone dag ook je langste terugkerende werkdag door.':'Je ritten zijn voorspelbaar: noteer retourafstand en laadmomenten voor een gewone week.')+'<\/p><a href=\"hybride-of-elektrisch.html#energie\">Vergelijk benzine én stroom<\/a>';});stale(phev,'phev-result');}\nconst ev=$('ev-form');\nif(ev){ev.addEventListener('submit',e=>{e.preventDefault();const v=values(ev,['weekly','meter','power']);if(!v)return;const kwh=v.weekly*v.meter/100,hours=kwh/v.power;const note={home:'Laat installatie, beschikbare aansluiting en vermogensregeling bevestigen.',work:'Controleer of je deze aangesloten tijd werkelijk op het werk krijgt.',public:'Verdeel deze tijd over haal
