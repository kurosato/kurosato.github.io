<!doctype html><html lang="nl-BE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Toyota De Bruyn · zes landingspagina’s</title><style>body{margin:0;background:#fff;color:#242424;font:16px/1.5 Arial,sans-serif}.chooser{padding:14px 20px;border-bottom:1px solid #aaa;background:#f2f2f2;display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{font-weight:bold}select{font:inherit;max-width:100%;min-height:44px;padding:8px}iframe{display:block;width:100%;border:0;min-height:900px}a{color:inherit}.chooser small{color:#535353}select:focus-visible{outline:3px solid #222;outline-offset:3px}</style></head><body><div class="chooser"><label for="page-choice">Bekijk pagina</label><select id="page-choice"><option value="hybride-of-elektrisch.html">Vergelijk aandrijvingen</option><option value="lez-brussel.html">LEZ Brussel</option><option value="plug-in-hybride.html">Plug-inhybride</option><option value="elektrisch-rijden.html">Elektrisch rijden</option><option value="full-hybrid.html">Full hybrid</option><option value="zakelijk-kiezen.html">Zakelijk kiezen</option></select><small>Losse concepten · werkt offline · zes kopvarianten per pagina</small></div><iframe id="page-frame" title="Geselecteerde landingspagina" sandbox="allow-scripts allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox"></iframe><script id="bundle" type="application/json">{"bodies": {"hybride-of-elektrisch.html": "<a class=\"skip\" href=\"#inhoud\">Ga naar inhoud<\/a><div class=\"review-bar\"><span>Los copywireframe · 5 november 2026 · geen aanvragen<\/span><label for=\"variant\">Vergelijk de kop<\/label><select id=\"variant\"><option value=\"0\">V0 · Jouw leven<\/option><option value=\"1\">V1 · Rijplezier<\/option><option value=\"2\">V2 · Helderheid<\/option><option value=\"3\">V3 · Budget<\/option><option value=\"4\">V4 · Warmte<\/option><option value=\"5\">V5 · Zelf ervaren<\/option><\/select><a href=\"index.html\">Alle pagina’s<\/a><\/div><header class=\"site-header\"><div class=\"headerline\"><a class=\"brand\" href=\"index.html\">Toyota De Bruyn<span>Machelen<\/span><\/a><a href=\"#voorbereiden\">Bereid je volgende stap voor<\/a><\/div><nav aria-label=\"Keuzehulp\"><a href=\"hybride-of-elektrisch.html\" aria-current=\"page\">Vergelijk aandrijvingen<\/a><a href=\"lez-brussel.html\">LEZ Brussel<\/a><a href=\"plug-in-hybride.html\">Plug-inhybride<\/a><a href=\"elektrisch-rijden.html\">Elektrisch rijden<\/a><a href=\"full-hybrid.html\">Full hybrid<\/a><a href=\"zakelijk-kiezen.html\">Zakelijk kiezen<\/a><\/nav><\/header><main id=\"inhoud\"><section class=\"hero\"><div><div class=\"hero-heading\"><h1 id=\"hero-title\">Kies geen afkorting. Kies hoe je wilt rijden.<\/h1><p id=\"hero-tagline\" class=\"tagline\">Full hybrid, plug-inhybride of elektrisch: jouw ritten en laadmogelijkheden maken het verschil.<\/p><\/div><p>Een lage verbruikswaarde is aantrekkelijk. Een wagen die prettig rijdt en in je week past nog meer. Hier leg je drie aandrijvingen naast elkaar, zonder dat één ervan vooraf moet winnen.<\/p><div class=\"actions\"><a class=\"button primary\" href=\"#energie\">Vergelijk mijn energiekosten<\/a><a class=\"button\" href=\"#kort\">Lees het korte antwoord<\/a><\/div><\/div><figure><img src=\"assets/interior.webp\" alt=\"Interieur van de Toyota C-HR+\" width=\"800\" height=\"600\"><figcaption>Eerst jouw dagelijks gebruik. Daarna de wagen die daarbij past.<\/figcaption><\/figure><\/section><div class=\"jump\" aria-label=\"Op deze pagina\"><a href=\"#kort\">Kort uitgelegd<\/a><a href=\"#deel-1\">Praktisch kiezen<\/a><a href=\"#vragen\">Veelgestelde vragen<\/a><a href=\"#bronnen\">Bronnen & actualiteit<\/a><\/div><section id=\"kort\" class=\"answer\"><h2>Vergelijk aandrijvingen: het korte antwoord<\/h2><p>Een full hybrid (HEV) combineert benzine en elektrisch rijden zonder stekker. Een plug-inhybride (PHEV) heeft een extern oplaadbare batterij én een benzinemotor. Een volledig elektrische wagen (BEV) rijdt op batterijstroom en moet je opladen. Begin je keuze bij je laadplek, dagelijkse ritten en totale budget.<\/p><span class=\"source-inline\">Bronnen: <a href=\"#bron-S04\">Toyota België: full-hybridtechnologie<\/a>, <a href=\"#bron-S05\">Toyota België: plug-inhybridetechnologie<\/a>, <a href=\"#bron-S06\">Toyota België: opladen<\/a><\/span><\/section><section id=\"deel-1\"><h2>Het verschil dat je elke week merkt<\/h2><div class=\"table-wrap\"><table><caption>Full hybrid, PHEV en EV op dezelfde criteria<\/caption><thead><tr><th scope=\"col\">In jouw week<\/th><th scope=\"col\">Full hybrid<\/th><th scope=\"col\">Plug-inhybride<\/th><th scope=\"col\">Elektrisch<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Energie aanvullen<\/th><td>Benzine tanken<\/td><td>Opladen én benzine tanken<\/td><td>Opladen<\/td><\/tr><tr><th scope=\"row\">Elektrische ritten<\/th><td>Kortere stukken, afhankelijk van omstandigheden<\/td><td>Langere stukken met geladen batterij; modelafhankelijk<\/td><td>Alle ritten elektrisch<\/td><\/tr><tr><th scope=\"row\">Belangrijkste voorbereiding<\/th><td>Verbruik op je eigen route vergelijken<\/td><td>Een laadritme dat je echt volhoudt<\/td><td>Laadplek, tarief en lange ritten plannen<\/td><\/tr><tr><th scope=\"row\">Niet vergeten<\/th><td>Heeft nog brandstofverbruik en uitlaatgassen<\/td><td>Weinig laden kan het voordeel sterk verkleinen<\/td><td>Rijbereik en laden veranderen met omstandigheden<\/td><\/tr><\/tbody><\/table><\/div><\/section><section id=\"energie\" class=\"tool\"><h2>Wat kosten jouw kilometers aan energie?<\/h2><p>Verander de voorbeeldwaarden. Vergelijk drie scenario’s bij hetzelfde aantal kilometers. Dit is <strong>geen offerte, marktprijs of volledige kostprijsberekening<\/strong>.<\/p><form id=\"energy-form\"><fieldset><legend>Jouw gebruik en tarieven<\/legend><div class=\"form-grid\"><div><label for=\"km\">Kilometers per jaar<\/label><input id=\"km\" name=\"km\" type=\"number\" value=\"15000\" min=\"0\" max=\"200000\" step=\"100\" required inputmode=\"decimal\" aria-describedby=\"km-hint\"><small id=\"km-hint\">km/jaar<\/small><\/div><div><label for=\"petrol\">Benzineprijs<\/label><input id=\"petrol\" name=\"petrol\" type=\"number\" value=\"1.8\" min=\"0\" max=\"10\" step=\".01\" required inputmode=\"decimal\" aria-describedby=\"petrol-hint\"><small id=\"petrol-hint\">€/liter, inclusief btw<\/small><\/div><div><label for=\"low\">Tarief op je hoofdlaadplek<\/label><input id=\"low\" name=\"low\" type=\"number\" value=\"0.3\" min=\"0\" max=\"5\" step=\".01\" required inputmode=\"decimal\" aria-describedby=\"low-hint\"><small id=\"low-hint\">€/kWh, inclusief btw<\/small><\/div><div><label for=\"high\">Tarief op andere laadplekken<\/label><input id=\"high\" name=\"high\" type=\"number\" value=\"0.6\" min=\"0\" max=\"5\" step=\".01\" required inputmode=\"decimal\" aria-describedby=\"high-hint\"><small id=\"high-hint\">€/kWh, inclusief btw<\/small><\/div><div><label for=\"home\">Deel van de stroom op de hoofdlaadplek<\/label><input id=\"home\" name=\"home\" type=\"number\" value=\"70\" min=\"0\" max=\"100\" step=\"1\" required inputmode=\"decimal\" aria-describedby=\"home-hint\"><small id=\"home-hint\">% van afgerekende kWh<\/small><\/div><\/div><\/fieldset><fieldset><legend>Verbruik en elektrisch aandeel: jouw aannames<\/legend><div class=\"form-grid\"><div><label for=\"hev\">Full hybrid: benzineverbruik<\/label><input id=\"hev\" name=\"hev\" type=\"number\" value=\"5\" min=\"0\" max=\"30\" step=\".1\" required inputmode=\"decimal\" aria-describedby=\"hev-hint\"><small id=\"hev-hint\">liter/100 km<\/small><\/div><div><label for=\"bev\">EV: afgerekende stroom<\/label><input id=\"bev\" name=\"bev\" type=\"number\" value=\"20\" min=\"0\" max=\"80\" step=\".1\" required inputmode=\"decimal\" aria-describedby=\"bev-hint\"><small id=\"bev-hint\">kWh/100 km, inclusief laadverliezen<\/small><\/div><div><label for=\"phev-e\">PHEV: stroom op elektrische kilometers<\/label><input id=\"phev-e\" name=\"phev-e\" type=\"number\" value=\"20\" min=\"0\" max=\"80\" step=\".1\" required inputmode=\"decimal\" aria-describedby=\"phev-e-hint\"><small id=\"phev-e-hint\">kWh/100 elektrische km, inclusief laadverliezen<\/small><\/div><div><label for=\"phev-f\">PHEV: benzine op overige kilometers<\/label><input id=\"phev-f\" name=\"phev-f\" type=\"number\" value=\"6.5\" min=\"0\" max=\"30\" step=\".1\" required inputmode=\"decimal\" aria-describedby=\"phev-f-hint\"><small id=\"phev-f-hint\">liter/100 niet-elektrische km; niet het gewogen WLTP-cijfer<\/small><\/div><div><label for=\"share\">PHEV: aandeel elektrische kilometers<\/label><input id=\"share\" name=\"share\" type=\"number\" value=\"60\" min=\"0\" max=\"100\" step=\"1\" required inputmode=\"decimal\" aria-describedby=\"share-hint\"><small id=\"share-hint\">% van alle kilometers; zet op 0 om zonder laden te vergelijken<\/small><\/div><\/div><\/fieldset><button class=\"button primary\" type=\"submit\">Bereken mijn energiescenario<\/button><button class=\"button\" type=\"reset\">Herstel voorbeeldwaarden<\/button><p class=\"small\">Vaste voorbeeldwaarden, geen actuele tarieven. Geen gegevensopslag of verzending.<\/p><\/form><div id=\"energy-result\" class=\"result\" aria-live=\"polite\"><\/div><details><summary>Bekijk de rekenwijze en wat ontbreekt<\/summary><p>Gewogen stroomtarief = aandeel hoofdlaadplek × hoofdlaadtarief + rest × ander tarief. Full hybrid per 100 km = liters × benzineprijs. EV = afgerekende kWh × stroomtarief. PHEV = elektrisch aandeel × elektrische kosten + overig aandeel × benzinekosten. Jaarbedrag = kosten per 100 km × jaarkilometers / 100.<\/p><p>Vereenvoudigd model: de PHEV-ritten worden in elektrische en overige kilometers verdeeld; gelijktijdig benzinegebruik in elektrische modus is niet apart gemodelleerd. Gebruik daarom een conservatief elektrisch aandeel. Bijladen door de motor zit niet als gratis externe stroom in de formule.<\/p><p>Niet inbegrepen: aanschaf/lease, restwaarde, financiering, laadinstallatie, onderhoud, banden, verzekering, verkeersbelastingen, fiscale effecten en losse sessie-/parkeerkosten. Kies passende praktijkwaarden; dit is geen modelvoorspelling.<\/p><\/details><\/section><section id=\"deel-2\"><h2>De juiste vraag is niet hoeveel je op één dag kán rijden.<\/h2><p>Het gaat om hoe je meestal rijdt. Noteer een gewone week: heen én terug naar het werk, omwegen, schoolritten en weekendbezoek. Leg daar je langste terugkerende rit naast. Een jaarlijkse vakantie verdient een laadplan, maar hoeft niet elke andere rit te dicteren.<\/p><p>Geen eigen oprit sluit elektrisch rijden niet automatisch uit. Een betrouwbare laadplek op het werk of in de buurt kan passen. Maar “er staat ergens een paal” is nog geen oplossing: kijk naar beschikbaarheid, toegangstijden, parkeerkosten en een alternatief.<\/p><\/section><section id=\"deel-3\"><h2>Een lagere energierekening is nog geen goedkopere wagen.<\/h2><p>Vergelijk naast energie ook aanschaf of lease, waardeverlies, verzekering, onderhoud, banden, belastingen en een eventuele laadinstallatie. Gebruik dezelfde looptijd, kilometers en inbegrepen diensten. Bij tweedehands tellen staat, onderhoudshistoriek en batterij-informatie mee.<\/p><p>Rijd je zakelijk? Houd de praktische keuze en de fiscale berekening apart. Een wagen kan prettig werken, maar anders worden behandeld in een eenmanszaak dan in een vennootschap. <a href=\"zakelijk-kiezen.html\">Maak de zakelijke vergelijking.<\/a><\/p><\/section><section id=\"deel-4\"><h2>Neem drie dingen mee naar je proefrit.<\/h2><ol class=\"steps\"><li><strong>Jouw route.<\/strong> Test stadsverkeer, een stuk Ring en parkeren zoals je dat zelf doet.<\/li><li><strong>Jouw spullen.<\/strong> Kinderstoel, werktas, buggy of sportmateriaal maken ruimte concreet.<\/li><li><strong>Jouw vragen.<\/strong> Laat de laadkabel, bediening en verbruiksweergave zien van de uitvoering die je overweegt.<\/li><\/ol><p>Vergelijk onder zo gelijk mogelijke omstandigheden. Eén korte proefrit voorspelt je jaarverbruik niet, maar maakt zitcomfort, zicht en bediening wel tastbaar.<\/p><\/section><section id=\"vragen\"><h2>Wat je nog wilt weten.<\/h2><details><summary>Welke aandrijving is het goedkoopst?<\/summary><p>Er is geen algemene winnaar. Vergelijk je aankoop- of leasekosten, verwachte restwaarde en gebruikskosten. De energiecalculator op deze pagina is slechts één deel van die afweging.<\/p><\/details><details><summary>Is een hybride hetzelfde als een elektrische auto?<\/summary><p>Nee. Een full hybrid en plug-inhybride hebben ook een verbrandingsmotor. Een BEV is volledig elektrisch. Het woord geëlektrificeerd kan meerdere aandrijvingen omvatten.<\/p><\/details><details><summary>Kan ik de calculator gebruiken voor een specifieke Toyota?<\/summary><p>Ja, als scenario. Vul tarieven en verbruiken in die passen bij de exacte uitvoering en je gebruik. Gebruik voor een PHEV niet het gewogen WLTP-benzinecijfer als verbruik wanneer je zonder laden rijdt.<\/p><\/details><details><summary>Moet ik mijn wagen vervangen voor Brussel?<\/summary><p>Niet zonder controle. Open eerst de officiële LEZ-check voor je huidige wagen en bezoekdatum. Bekijk daarna of een dagpas, andere reiswijze of vervanging zinvol is.<\/p><\/details><\/section><section id=\"voorbereiden\"><div class=\"prep-grid\"><div><h2>Maak je keuze tastbaar.<\/h2><p>Je hoeft nog geen model te kiezen. Neem je ritten, laadmogelijkheid en budget mee. Zo wordt een proefrit een vergelijking die je echt verder helpt.<\/p><p><strong>Kom thuis bij een garage waar iedereen je kent.<\/strong><\/p><p>Bij De Bruyn in Machelen begint een goed gesprek bij wat jij nodig hebt, niet bij een afkorting.<\/p><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.toyotadebruyn.be/nl/about/machelen\">Bekijk de officiële contactpagina<\/a><p class=\"small\">Externe website. Deze proefpagina verstuurt zelf geen contact- of proefritaanvraag.<\/p><\/div><aside><h3>Neem dit mee.<\/h3><label><input type=\"checkbox\"> <span>Mijn normale week en langste terugkerende rit<\/span><\/label><label><input type=\"checkbox\"> <span>Mijn laadplek, tarief en alternatief<\/span><\/label><label><input type=\"checkbox\"> <span>Mijn totaalbudget en gewenste gebruiksduur<\/span><\/label><label><input type=\"checkbox\"> <span>Wat ik tijdens de proefrit wil ervaren<\/span><\/label><button id=\"prep-download\" type=\"button\">Download mijn voorbereiding<\/button><p class=\"small\">Vrij beschikbaar, zonder e-mailadres.<\/p><\/aside><\/div><\/section><section><h2>Verder met jouw keuze.<\/h2><div class=\"related\"><a href=\"plug-in-hybride.html\">Plug-inhybride<\/a><a href=\"elektrisch-rijden.html\">Elektrisch rijden<\/a><a href=\"full-hybrid.html\">Full hybrid<\/a><a href=\"lez-brussel.html\">LEZ Brussel<\/a><a href=\"zakelijk-kiezen.html\">Zakelijk kiezen<\/a><\/div><\/section><section id=\"bronnen\"><h2>Bronnen en actualiteit<\/h2><p class=\"small\">Inhoud gecontroleerd op 5 november 2026. Regelgeving, modellen en voorwaarden kunnen wijzigen. Dit is een redactioneel concept ter beoordeling door Toyota De Bruyn, geen definitief aanbod of individueel fiscaal/juridisch advies.<\/p><ol class=\"sources\"><li id=\"bron-S04\"><a href=\"https://nl.toyota.be/elektrische-modellen/hybride\" target=\"_blank\" rel=\"noopener noreferrer\">Toyota België: full-hybridtechnologie<\/a><p>Uitleg van Toyota België over hybridetechnologie.<\/p><\/li><li id=\"bron-S05\"><a href=\"https://nl.toyota.be/elektrische-modellen/plug-in-hybride.html\" target=\"_blank\" rel=\"noopener noreferrer\">Toyota België: plug-inhybridetechnologie<\/a><p>Werking van een plug-inhybride. Controleer prestaties per model en uitvoering.<\/p><\/li><li id=\"bron-S06\"><a href=\"https://nl.toyota.be/elektrische-modellen/opladen\" target=\"_blank\" rel=\"noopener noreferrer\">Toyota België: opladen<\/a><p>Laadmogelijkheden en praktische uitleg van Toyota België.<\/p><\/li><li id=\"bron-S09\"><a href=\"https://www.deloitte.com/be/en/about/press-room/global-automotive-consumer-study-2026.html\" target=\"_blank\" rel=\"noopener noreferrer\">Deloitte: Belgische consumentenstudie 2026<\/a><p>Belgische consumentenstudie, editie 2026.<\/p><\/li><li id=\"bron-S11\"><a href=\"https://climate.ec.europa.eu/news-other-reads/news/first-commission-report-real-world-co2-emissions-cars-and-vans-using-data-board-fuel-consumption-2024-03-18_en\" target=\"_blank\" rel=\"noopener noreferrer\">Europese Commissie: werkelijk verbruik<\/a><p>Europese praktijkmeting, gepubliceerd in 2024 over registraties uit 2021; geen voorspelling voor jouw wagen.<\/p><\/li><\/ol><\/section><\/main><footer class=\"site-footer\"><strong>Toyota De Bruyn · Machelen<\/strong><a href=\"index.html\">Overzicht<\/a><span>Geen tracking of verzending van contactaanvragen in deze proef.<\/span><\/footer><script type=\"application/json\" id=\"variant-data\">[[\"Jouw leven\", \"Kies geen afkorting. Kies hoe je wilt rijden.\", \"Full hybrid, plug-inhybride of elektrisch: jouw ritten en laadmogelijkheden maken het verschil.\"], [\"Rijplezier\", \"Je volgende wagen begint bij je volgende rit.\", \"De schoolrun, de werkdag, het weekend weg. Vind de aandrijving die daarin past.\"], [\"Helderheid\", \"Drie aandrijvingen. Eén keuze die bij jou moet passen.\", \"Vergelijk wat je elke dag merkt: laden, tanken, kosten en ruimte om verder te rijden.\"], [\"Budget\", \"Kijk verder dan de prijs achter de voorruit.\", \"Wat je betaalt om te rijden telt ook. Maak de vergelijking met je eigen kilometers en tarieven.\"], [\"Warmte\", \"Je hoeft de techniek niet te kennen. Je eigen leven wel.\", \"Vertel hoe je rijdt. De verschillen tussen hybride en elektrisch maken we samen begrijpelijk.\"], [\"Zelf ervaren\", \"Laat de afkortingen hier. Neem je rijgevoel mee.\", \"Begrijp eerst het verschil. Voel daarna op dezelfde route wat bij je past.\"]]<\/script>", "lez-brussel.html": "<a class=\"skip\" href=\"#inhoud\">Ga naar inhoud<\/a><div class=\"review-bar\"><span>Los copywireframe · 5 november 2026 · geen aanvragen<\/span><label for=\"variant\">Vergelijk de kop<\/label><select id=\"variant\"><option value=\"0\">V0 · Rust en richting<\/option><option value=\"1\">V1 · Geen haastkoop<\/option><option value=\"2\">V2 · Dagelijks leven<\/option><option value=\"3\">V3 · Zelf controle<\/option><option value=\"4\">V4 · Zakelijk<\/option><option value=\"5\">V5 · Vooruitkijken<\/option><\/select><a href=\"index.html\">Alle pagina’s<\/a><\/div><header class=\"site-header\"><div class=\"headerline\"><a class=\"brand\" href=\"index.html\">Toyota De Bruyn<span>Machelen<\/span><\/a><a href=\"#voorbereiden\">Bereid je volgende stap voor<\/a><\/div><nav aria-label=\"Keuzehulp\"><a href=\"hybride-of-elektrisch.html\">Vergelijk aandrijvingen<\/a><a href=\"lez-brussel.html\" aria-current=\"page\">LEZ Brussel<\/a><a href=\"plug-in-hybride.html\">Plug-inhybride<\/a><a href=\"elektrisch-rijden.html\">Elektrisch rijden<\/a><a href=\"full-hybrid.html\">Full hybrid<\/a><a href=\"zakelijk-kiezen.html\">Zakelijk kiezen<\/a><\/nav><\/header><main id=\"inhoud\"><section class=\"hero\"><div><div class=\"hero-heading\"><h1 id=\"hero-title\">Blijf Brussel bereiken. Met een plan dat klopt.<\/h1><p id=\"hero-tagline\" class=\"tagline\">Controleer eerst je huidige wagen. Kies pas daarna hoe je verder wilt rijden.<\/p><\/div><p>Een familiebezoek. Een werkdag. Een klant in de stad. Je wilt weten hoe je er geraakt, niet verdwalen in tegenstrijdige berichten. Begin met de officiële controle en bekijk daarna je mogelijkheden.<\/p><div class=\"actions\"><a target=\"_blank\" rel=\"noopener noreferrer\" class=\"button primary\" href=\"https://lez.brussels/mytax/nl/automatic-simulation\">Controleer mijn wagen op lez.brussels<\/a><a class=\"button\" href=\"#kort\">Lees het korte antwoord<\/a><\/div><\/div><figure><img src=\"assets/dealer.webp\" alt=\"De showroom van Toyota De Bruyn in Machelen\" width=\"800\" height=\"600\"><figcaption>De Bruyn in Machelen. Controleer je volledige route als je via Brussel rijdt.<\/figcaption><\/figure><\/section><div class=\"jump\" aria-label=\"Op deze pagina\"><a href=\"#kort\">Kort uitgelegd<\/a><a href=\"#deel-1\">Praktisch kiezen<\/a><a href=\"#vragen\">Veelgestelde vragen<\/a><a href=\"#bronnen\">Bronnen & actualiteit<\/a><\/div><section id=\"kort\" class=\"answer\"><h2>LEZ Brussel: het korte antwoord<\/h2><p>Voor Brussel hangt LEZ-toegang af van onder meer voertuigcategorie, brandstof en Euronorm. Volgens de officiële informatie voldoen Euro 5-diesels en Euro 2-benzinewagens sinds 1 januari 2026 niet meer aan de algemene toegangscriteria. Controleer je eigen voertuig en eventuele uitzondering via lez.brussels.<\/p><span class=\"source-inline\">Bronnen: <a href=\"#bron-S01\">Brusselse LEZ: actuele hoofdpagina<\/a>, <a href=\"#bron-S02\">Brusselse LEZ: gebied en voertuigcriteria<\/a><\/span><\/section><section id=\"controle\" class=\"tool\"><h2>Gebruik de officiële controle. Kies daarna je vervolgstap.<\/h2><p>Deze pagina beoordeelt geen nummerplaat. De officiële simulator en actuele voorwaarden zijn leidend.<\/p><div class=\"actions\"><a class=\"button primary\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://lez.brussels/mytax/nl/automatic-simulation\">Open de officiële voertuigcontrole<\/a><a class=\"button\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://lez.brussels/mytax/nl/practical\">Bekijk gebied en kalender<\/a><\/div><form id=\"lez-form\"><div><label for=\"lez-state\">Wat is je volgende stap?<\/label><select id=\"lez-state\" name=\"lez-state\"><option value=\"unknown\">Ik moet mijn voertuig nog controleren<\/option><option value=\"allowed\">Ik heb gecontroleerd: toegang toegestaan<\/option><option value=\"sometimes\">Geen toegang, ik kom af en toe in Brussel<\/option><option value=\"often\">Geen toegang, ik kom vaak in Brussel<\/option><\/select><\/div><button class=\"button\" type=\"submit\">Toon mijn voorbereiding<\/button><\/form><div id=\"lez-result\" class=\"result\" aria-live=\"polite\"><\/div><p class=\"small\">Je kiest zelf de situatie. Dit is geen geautomatiseerd toelatingsadvies en er wordt niets verstuurd.<\/p><\/section><section id=\"deel-1\"><h2>Eerst je documenten. Dan de uitkomst.<\/h2><p>Houd je inschrijvingsbewijs bij de hand. De categorie staat bij <strong>J<\/strong>, de brandstof bij <strong>P3<\/strong> en de Euronorm bij <strong>V9<\/strong>. De officiële simulator kan ook de nummerplaat en datum van eerste inschrijving vragen. Vul die rechtstreeks bij de overheid in, niet op deze pagina.<\/p><p>“Hybride” is op zichzelf geen toegangsbewijs. Ook elektrisch rijden met een PHEV verandert de geregistreerde voertuigcategorie en brandstof niet. De officiële uitkomst gaat vóór een verkoopslogan.<\/p><span class=\"source-inline\">Bronnen: <a href=\"#bron-S02\">Brusselse LEZ: gebied en voertuigcriteria<\/a><\/span><\/section><section id=\"deel-2\"><h2>Drie uitkomsten. Niet één verkoopverhaal.<\/h2><div class=\"editorial-list\"><article><h3>Je wagen mag nog binnen.<\/h3><p>Dan hoef je op basis van de huidige toegang niet meteen te vervangen. Bekijk wel de periode waarin je de wagen wilt houden en volg de officiële kalender.<\/p><\/article><article><h3>Je rijdt maar af en toe Brussel in.<\/h3><p>Bekijk een dagpas, een toepasselijke afwijking of een combinatie met openbaar vervoer. Een dagpas voor een personenwagen kost op de controledatum €35; het maximum is 24 per jaar per nummerplaat. Controleer de aankoopvoorwaarden rechtstreeks bij de overheid.<\/p><\/article><article><h3>Brussel hoort bij je dagelijkse week.<\/h3><p>Maak dan een structureel plan. Vergelijk vervanging met andere reisopties. Bij een andere wagen tellen niet alleen toegang, maar ook laden, ruimte, rijgevoel en totale kosten mee.<\/p><\/article><\/div><span class=\"source-inline\">Bronnen: <a href=\"#bron-S03\">Brusselse LEZ: dagpas<\/a>, <a href=\"#bron-S17\">Brusselse LEZ: afwijkingen<\/a><\/span><\/section><section id=\"deel-3\"><h2>De Ring is niet hetzelfde als de stad.<\/h2><p>De LEZ omvat de 19 gemeenten van het Brussels Hoofdstedelijk Gewest en geldt permanent. De Ring en bepaalde toegangswegen naar transitparkings vallen erbuiten. Een afrit of tussenstop kan je route wel door de zone leiden. Controleer daarom de officiële kaart voor de hele rit.<\/p><p>Machelen ligt buiten het Brussels Hoofdstedelijk Gewest. Dat maakt niet iedere route naar de garage automatisch LEZ-vrij. Laat je routeplanner en de officiële kaart dezelfde reis tonen.<\/p><span class=\"source-inline\">Bronnen: <a href=\"#bron-S02\">Brusselse LEZ: gebied en voertuigcriteria<\/a><\/span><\/section><section id=\"deel-4\"><h2>Vervangen? Kies ook voor de kilometers buiten Brussel.<\/h2><p>Een comfortabele woon-werkrit, genoeg ruimte voor het gezin en een haalbare laadplek blijven belangrijk. Een full hybrid heeft geen stekker nodig. Een PHEV vraagt regelmatig opladen om zijn elektrische mogelijkheden te benutten. Een EV vraagt een laadplan voor al je ritten.<\/p><p>Maak geen langetermijnkeuze op basis van de belofte dat een bepaalde hybride “altijd overal binnen mag”. <a href=\"hybride-of-elektrisch.html\">Vergelijk de aandrijvingen op jouw gebruik.<\/a><\/p><p>Voor ondernemers: zet naast je klantadressen ook voertuigcategorie en contractdatum op papier. De LEZ en fiscale aftrek zijn twee verschillende controles. <a href=\"zakelijk-kiezen.html\">Bekijk de zakelijke voorbereiding.<\/a><\/p><\/section><section id=\"vragen\"><h2>Wat je nog wilt weten.<\/h2><details><summary>Mag een plug-inhybride automatisch Brussel binnen?<\/summary><p>Nee. De aanduiding plug-inhybride en rijden in EV-modus vervangen de officiële voertuigcontrole niet. Controleer onder meer de brandstof, Euronorm en categorie van de specifieke wagen.<\/p><\/details><details><summary>Valt de Brusselse Ring onder de LEZ?<\/summary><p>De Ring zelf valt buiten de zone. Voor afritten, aansluitende straten en transitparkings moet je de officiële kaart en toegangswegen controleren.<\/p><\/details><details><summary>Moet ik mijn Euro 5-diesel onmiddellijk verkopen?<\/summary><p>Niet noodzakelijk. Je totale gebruik, bezoekfrequentie, eventuele uitzonderingen en alternatieven bepalen wat logisch is. Dat verandert niets aan de geldende toegangsregels.<\/p><\/details><details><summary>Kan De Bruyn een vrijstelling regelen?<\/summary><p>Een afwijking wordt niet door de garage toegekend. Volg de officiële aanvraagroute en voorwaarden. Een ingediende aanvraag is nog geen bevestigde toestemming.<\/p><\/details><\/section><section id=\"voorbereiden\"><div class=\"prep-grid\"><div><h2>Eerst weten waar je staat. Dan kiezen waar je heen wilt.<\/h2><p>Heb je de officiële uitkomst? Neem die samen met je ritten en budget mee. Daarmee kun je een passende vervanger vergelijken, als vervangen voor jou aan de orde is.<\/p><p><strong>Kom thuis bij een garage waar iedereen je kent.<\/strong><\/p><p>Bij De Bruyn in Machelen begint een goed gesprek bij wat jij nodig hebt, niet bij een afkorting.<\/p><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.toyotadebruyn.be/nl/about/machelen\">Bekijk de officiële contactpagina<\/a><p class=\"small\">Externe website. Deze proefpagina verstuurt zelf geen contact- of proefritaanvraag.<\/p><\/div><aside><h3>Neem dit mee.<\/h3><label><input type=\"checkbox\"> <span>Officiële LEZ-uitkomst en datum van controle<\/span><\/label><label><input type=\"checkbox\"> <span>Aantal dagen per maand in Brussel<\/span><\/label><label><input type=\"checkbox\"> <span>Mijn dagelijkse ritten en laadmogelijkheden<\/span><\/label><label><input type=\"checkbox\"> <span>Gewenste gebruiksduur en budget<\/span><\/label><button id=\"prep-download\" type=\"button\">Download mijn voorbereiding<\/button><p class=\"small\">Vrij beschikbaar, zonder e-mailadres.<\/p><\/aside><\/div><\/section><section><h2>Verder met jouw keuze.<\/h2><div class=\"related\"><a href=\"hybride-of-elektrisch.html\">Vergelijk aandrijvingen<\/a><a href=\"elektrisch-rijden.html\">Elektrisch rijden<\/a><a href=\"zakelijk-kiezen.html\">Zakelijk kiezen<\/a><\/div><\/section><section id=\"bronnen\"><h2>Bronnen en actualiteit<\/h2><p class=\"small\">Inhoud gecontroleerd op 5 november 2026. Regelgeving, modellen en voorwaarden kunnen wijzigen. Dit is een redactioneel concept ter beoordeling door Toyota De Bruyn, geen definitief aanbod of individueel fiscaal/juridisch advies.<\/p><ol class=\"sources\"><li id=\"bron-S01\"><a href=\"https://lez.brussels/mytax/nl/\" target=\"_blank\" rel=\"noopener noreferrer\">Brusselse LEZ: actuele hoofdpagina<\/a><p>Officiële Brusselse toegangsregels en actuele informatie.<\/p><\/li><li id=\"bron-S02\"><a href=\"https://lez.brussels/mytax/nl/practical\" target=\"_blank\" rel=\"noopener noreferrer\">Brusselse LEZ: gebied en voertuigcriteria<\/a><p>Kaart, voertuigcategorie, brandstof en Euronorm.<\/p><\/li><li id=\"bron-S03\"><a href=\"https://lez.brussels/mytax/nl/day-pass-info\" target=\"_blank\" rel=\"noopener noreferrer\">Brusselse LEZ: dagpas<\/a><p>Prijzen en voorwaarden van de officiële dagpas.<\/p><\/li><li id=\"bron-S17\"><a href=\"https://lez.brussels/mytax/nl/exemptions\" target=\"_blank\" rel=\"noopener noreferrer\">Brusselse LEZ: afwijkingen<\/a><p>Officiële voorwaarden voor afwijkingen op de LEZ-regels.<\/p><\/li><\/ol><\/section><\/main><footer class=\"site-footer\"><strong>Toyota De Bruyn · Machelen<\/strong><a href=\"index.html\">Overzicht<\/a><span>Geen tracking of verzending van contactaanvragen in deze proef.<\/span><\/footer><script type=\"application/json\" id=\"variant-data\">[[\"Rust en richting\", \"Blijf Brussel bereiken. Met een plan dat klopt.\", \"Controleer eerst je huidige wagen. Kies pas daarna hoe je verder wilt rijden.\"], [\"Geen haastkoop\", \"Een LEZ-vraag is nog geen reden voor een nieuwe wagen.\", \"Eerst duidelijkheid over toegang en alternatieven. Daarna een keuze op jouw maat.\"], [\"Dagelijks leven\", \"Je werk, familie en plannen stoppen niet aan de stadsgrens.\", \"Ontdek wat de Brusselse LEZ betekent voor jouw ritten en je volgende wagen.\"], [\"Zelf controle\", \"Voor je een andere wagen kiest, check deze.\", \"De officiële voertuigcontrole geeft je het juiste vertrekpunt voor Brussel.\"], [\"Zakelijk\", \"Je klanten in Brussel blijven bereikbaar. Regel je route.\", \"Maak voertuigtoegang onderdeel van je planning, naast je werkdag en vervangmoment.\"], [\"Vooruitkijken\", \"Kijk verder dan de rit van morgen.\", \"Weeg toegang, laadmogelijkheden en gebruik samen af voordat je een wagen kiest.\"]]<\/script>", "plug-in-hybride.html": "<a class=\"skip\" href=\"#inhoud\">Ga naar inhoud<\/a><div class=\"review-bar\"><span>Los copywireframe · 5 november 2026 · geen aanvragen<\/span><label for=\"variant\">Vergelijk de kop<\/label><select id=\"variant\"><option value=\"0\">V0 · Dagelijks gemak<\/option><option value=\"1\">V1 · Eerlijk kiezen<\/option><option value=\"2\">V2 · Vrijheid<\/option><option value=\"3\">V3 · Kosten<\/option><option value=\"4\">V4 · Warmte<\/option><option value=\"5\">V5 · Praktijk<\/option><\/select><a href=\"index.html\">Alle pagina’s<\/a><\/div><header class=\"site-header\"><div class=\"headerline\"><a class=\"brand\" href=\"index.html\">Toyota De Bruyn<span>Machelen<\/span><\/a><a href=\"#voorbereiden\">Bereid je volgende stap voor<\/a><\/div><nav aria-label=\"Keuzehulp\"><a href=\"hybride-of-elektrisch.html\">Vergelijk aandrijvingen<\/a><a href=\"lez-brussel.html\">LEZ Brussel<\/a><a href=\"plug-in-hybride.html\" aria-current=\"page\">Plug-inhybride<\/a><a href=\"elektrisch-rijden.html\">Elektrisch rijden<\/a><a href=\"full-hybrid.html\">Full hybrid<\/a><a href=\"zakelijk-kiezen.html\">Zakelijk kiezen<\/a><\/nav><\/header><main id=\"inhoud\"><section class=\"hero\"><div><div class=\"hero-heading\"><h1 id=\"hero-title\">Elektrisch naar je werk. Ruimte voor wat daarna komt.<\/h1><p id=\"hero-tagline\" class=\"tagline\">Een plug-inhybride kan beide combineren, als opladen bij jouw week hoort.<\/p><\/div><p>Stil vertrekken naar het werk en op een langere rit ook benzine kunnen gebruiken: dat maakt een plug-inhybride aantrekkelijk. Het voordeel wordt concreet wanneer je batterij niet alleen groter is, maar ook regelmatig wordt opgeladen.<\/p><div class=\"actions\"><a class=\"button primary\" href=\"#laadritme\">Toets mijn laadritme<\/a><a class=\"button\" href=\"#kort\">Lees het korte antwoord<\/a><\/div><\/div><figure><img src=\"assets/rav4.webp\" alt=\"Vooraanzicht van een Toyota RAV4\" width=\"800\" height=\"600\"><figcaption>Toyota RAV4 als modelvoorbeeld. Aandrijving, uitvoering en modeljaar apart controleren.<\/figcaption><\/figure><\/section><div class=\"jump\" aria-label=\"Op deze pagina\"><a href=\"#kort\">Kort uitgelegd<\/a><a href=\"#deel-1\">Praktisch kiezen<\/a><a href=\"#vragen\">Veelgestelde vragen<\/a><a href=\"#bronnen\">Bronnen & actualiteit<\/a><\/div><section id=\"kort\" class=\"answer\"><h2>Plug-inhybride: het korte antwoord<\/h2><p>Een plug-inhybride (PHEV) heeft een verbrandingsmotor en een batterij die je extern kunt opladen. Met voldoende lading kan hij een deel van je ritten elektrisch afleggen. Als de elektrische rijvoorraad is opgebruikt, kan de wagen verder als hybride. Regelmatig laden en een passend ritprofiel zijn bepalend.<\/p><span class=\"source-inline\">Bronnen: <a href=\"#bron-S05\">Toyota België: plug-inhybridetechnologie<\/a><\/span><\/section><section id=\"laadritme\" class=\"tool\"><h2>Past opladen in jouw week?<\/h2><p>Niet de grootste batterij, maar je werkelijke laadgewoonte bepaalt wat je ermee doet.<\/p><form id=\"phev-form\"><div class=\"form-grid\"><div><label for=\"habit\">Hoe betrouwbaar is je laadmogelijkheid?<\/label><select id=\"habit\" name=\"habit\"><option value=\"regular\">Regelmatig thuis of op het werk<\/option><option value=\"public\">Vooral publieke laadpunten<\/option><option value=\"rare\">Zelden of nog geen oplossing<\/option><\/select><\/div><div><label for=\"trip\">Hoe voorspelbaar zijn je dagelijkse ritten?<\/label><select id=\"trip\" name=\"trip\"><option value=\"fixed\">Meestal vergelijkbare afstanden<\/option><option value=\"variable\">Sterk wisselend of vaak lange dagen<\/option><\/select><\/div><\/div><button class=\"button primary\" type=\"submit\">Bekijk mijn aandachtspunten<\/button><\/form><div id=\"phev-result\" class=\"result\" aria-live=\"polite\"><\/div><p class=\"small\">Oriëntatie, geen modeladvies. Je budget, exacte uitvoering en overige gebruikseisen blijven meewegen.<\/p><\/section><section id=\"deel-1\"><h2>Denk in een week, niet in een brochuregetal.<\/h2><p>Je rijdt misschien vijf dagen dezelfde afstand en in het weekend veel verder. Dat is iets anders dan elke dag honderden kilometers zonder vaste parkeerplek. Noteer wanneer je werkelijk kunt laden, thuis of op het werk, en of je daar voldoende tijd voor hebt.<\/p><p>Gebruik voor de vergelijking het rijbereik van de exacte uitvoering. Kou, snelheid, verwarming en rijstijl beïnvloeden het resultaat. Zelfs met een geladen batterij kan de benzinemotor onder bepaalde omstandigheden inschakelen. Een geadverteerd elektrisch bereik is geen garantie voor elke rit.<\/p><\/section><section id=\"deel-2\"><h2>Wanneer een PHEV het onderzoeken waard is.<\/h2><ul class=\"check-list\"><li>Je hebt regelmatig een bruikbare laadplek.<\/li><li>Een betekenisvol deel van je gebruik kan met geladen batterij plaatsvinden.<\/li><li>Je wilt op andere ritten ook de benzinemotor kunnen gebruiken.<\/li><li>De meerprijs, ruimte en totale gebruikskosten passen binnen je budget.<\/li><\/ul><p>Als je zelden kunt of wilt laden, vergelijk dan expliciet met een full hybrid en een EV met haalbaar laadplan. De extra batterij alleen maakt een PHEV niet automatisch zuiniger of goedkoper.<\/p><\/section><section id=\"deel-3\"><h2>Het lage benzinecijfer vertelt niet het hele verhaal.<\/h2><p>Het gewogen officiële PHEV-verbruik combineert verschillende gebruikssituaties. Behandel dat cijfer niet als wat je altijd verbruikt wanneer je niet oplaadt. Vraag ook naar het verbruik met een ontladen tractiebatterij en tel de gekochte elektriciteit mee.<\/p><p>Europese praktijkmetingen laten zien waarom het laadgedrag ertoe doet. Het historische vlootgemiddelde is geen voorspelling voor jouw Toyota. Het is wel een reden om je eigen aannames zichtbaar te maken. <a href=\"hybride-of-elektrisch.html#energie\">Vergelijk energie met én zonder elektrische kilometers.<\/a><\/p><span class=\"source-inline\">Bronnen: <a href=\"#bron-S11\">Europese Commissie: werkelijk verbruik<\/a><\/span><\/section><section id=\"deel-4\"><h2>Test meer dan de acceleratie.<\/h2><p>Laat tijdens de proefrit het omschakelen tussen aandrijvingen ervaren. Probeer de kabel en laadpoort, bekijk het laadvermogen van de uitvoering en controleer of de bagageruimte jouw spullen aankan. Moet je een aanhanger trekken? Vraag naar de toegestane massa van precies die variant.<\/p><p>Niet elke PHEV kan DC-snelladen. Ook binnen een modelnaam kunnen generaties verschillen. De Belgische RAV4-pagina beschrijft hybride en plug-inhybride uitvoeringen; dat maakt de RAV4 geen volledig elektrische wagen. Vraag steeds de actuele technische fiche. <a class=\"reference\" href=\"#bron-S07\">[S07]<\/a><\/p><\/section><section id=\"vragen\"><h2>Wat je nog wilt weten.<\/h2><details><summary>Kan een PHEV rijden zonder dat ik hem oplaad?<\/summary><p>Ja, zolang er voldoende brandstof is en de wagen normaal functioneert. Maar je benut dan niet dezelfde externe elektrische energie. Vergelijk het werkelijke verbruik en de meerprijs met andere aandrijvingen.<\/p><\/details><details><summary>Is een PHEV voordelig als ik alleen publiek kan laden?<\/summary><p>Dat hangt af van tarief, beschikbaarheid, parkeerkosten en hoe vaak je er werkelijk laadt. Een dure of onhandige laadplek kan een aantrekkelijke berekening veranderen.<\/p><\/details><details><summary>Hoe lang duurt opladen?<\/summary><p>Dat hangt af van de hoeveelheid bij te laden energie, het laadvermogen van wagen en laadpunt, de temperatuur en laadverliezen. Controleer de AC- en eventuele DC-mogelijkheden van de exacte uitvoering.<\/p><\/details><details><summary>Is een plug-inhybride fiscaal hetzelfde als een full hybrid?<\/summary><p>Nee, die begrippen zijn niet uitwisselbaar. Voor zakelijk gebruik tellen daarnaast belastingstelsel, datum en voertuiggegevens mee. Bekijk de zakelijke pagina vóór je conclusies trekt.<\/p><\/details><\/section><section id=\"voorbereiden\"><div class=\"prep-grid\"><div><h2>Neem je week mee. Voel het verschil achter het stuur.<\/h2><p>Een PHEV moet niet alleen prettig rijden. Ook het opladen moet kloppen. Bereid je proefrit voor met de ritten en laadmomenten die je echt verwacht.<\/p><p><strong>Kom thuis bij een garage waar iedereen je kent.<\/strong><\/p><p>Bij De Bruyn in Machelen begint een goed gesprek bij wat jij nodig hebt, niet bij een afkorting.<\/p><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.toyotadebruyn.be/nl/about/machelen\">Bekijk de officiële contactpagina<\/a><p class=\"small\">Externe website. Deze proefpagina verstuurt zelf geen contact- of proefritaanvraag.<\/p><\/div><aside><h3>Neem dit mee.<\/h3><label><input type=\"checkbox\"> <span>Mijn dagelijkse retourafstand en langere ritten<\/span><\/label><label><input type=\"checkbox\"> <span>Waar en hoe vaak ik echt kan laden<\/span><\/label><label><input type=\"checkbox\"> <span>Laadtarief, parkeer- en eventuele sessiekosten<\/span><\/label><label><input type=\"checkbox\"> <span>Vragen over rijden zonder lading, ruimte en trekken<\/span><\/label><button id=\"prep-download\" type=\"button\">Download mijn voorbereiding<\/button><p class=\"small\">Vrij beschikbaar, zonder e-mailadres.<\/p><\/aside><\/div><\/section><section><h2>Verder met jouw keuze.<\/h2><div class=\"related\"><a href=\"hybride-of-elektrisch.html\">Vergelijk aandrijvingen<\/a><a href=\"full-hybrid.html\">Full hybrid<\/a><a href=\"elektrisch-rijden.html\">Elektrisch rijden<\/a><a href=\"zakelijk-kiezen.html\">Zakelijk kiezen<\/a><\/div><\/section><section id=\"bronnen\"><h2>Bronnen en actualiteit<\/h2><p class=\"small\">Inhoud gecontroleerd op 5 november 2026. Regelgeving, modellen en voorwaarden kunnen wijzigen. Dit is een redactioneel concept ter beoordeling door Toyota De Bruyn, geen definitief aanbod of individueel fiscaal/juridisch advies.<\/p><ol class=\"sources\"><li id=\"bron-S05\"><a href=\"https://nl.toyota.be/elektrische-modellen/plug-in-hybride.html\" target=\"_blank\" rel=\"noopener noreferrer\">Toyota België: plug-inhybridetechnologie<\/a><p>Werking van een plug-inhybride. Controleer prestaties per model en uitvoering.<\/p><\/li><li id=\"bron-S06\"><a href=\"https://nl.toyota.be/elektrische-modellen/opladen\" target=\"_blank\" rel=\"noopener noreferrer\">Toyota België: opladen<\/a><p>Laadmogelijkheden en praktische uitleg van Toyota België.<\/p><\/li><li id=\"bron-S07\"><a href=\"https://nl.toyota.be/modellen/rav4\" target=\"_blank\" rel=\"noopener noreferrer\">Toyota België: RAV4<\/a><p>Belgische modelpagina. Controleer aandrijving en gegevens voor het juiste modeljaar.<\/p><\/li><li id=\"bron-S11\"><a href=\"https://climate.ec.europa.eu/news-other-reads/news/first-commission-report-real-world-co2-emissions-cars-and-vans-using-data-board-fuel-consumption-2024-03-18_en\" target=\"_blank\" rel=\"noopener noreferrer\">Europese Commissie: werkelijk verbruik<\/a><p>Europese praktijkmeting, gepubliceerd in 2024 over registraties uit 2021; geen voorspelling voor jouw wagen.<\/p><\/li><li id=\"bron-S20\"><a href=\"https://nl.toyota.be/elektrische-modellen/waar-en-hoe-opladen\" target=\"_blank\" rel=\"noopener noreferrer\">Toyota België: waar en hoe opladen<\/a><p>Laden en aandachtspunten voor een geschikte elektrische installatie.<\/p><\/li><\/ol><\/section><\/main><footer class=\"site-footer\"><strong>Toyota De Bruyn · Machelen<\/strong><a href=\"index.html\">Overzicht<\/a><span>Geen tracking of verzending van contactaanvragen in deze proef.<\/span><\/footer><script type=\"application/json\" id=\"variant-data\">[[\"Dagelijks gemak\", \"Elektrisch naar je werk. Ruimte voor wat daarna komt.\", \"Een plug-inhybride kan beide combineren, als opladen bij jouw week hoort.\"], [\"Eerlijk kiezen\", \"Een stekker maakt nog geen elektrische gewoonte.\", \"Ontdek of je een PHEV vaak genoeg kunt laden om er echt gebruik van te maken.\"], [\"Vrijheid\", \"Je gewone rit elektrisch. Je plannen niet kleiner.\", \"Vergelijk hoe een oplaadbare hybride past bij je dagelijkse kilometers en langere reizen.\"], [\"Kosten\", \"Tel niet alleen de liters. Tel je laadbeurten mee.\", \"De werkelijke rekening van een PHEV bestaat uit benzine én stroom.\"], [\"Warmte\", \"Een wagen voor je vaste ritten én je spontane plannen.\", \"Leg je week op tafel. Dan wordt duidelijk of plug-inhybride bij jou past.\"], [\"Praktijk\", \"De beste PHEV past niet alleen op papier.\", \"Hij past bij waar je parkeert, wanneer je laadt en hoe je graag rijdt.\"]]<\/script>", "elektrisch-rijden.html": "<a class=\"skip\" href=\"#inhoud\">Ga naar inhoud<\/a><div class=\"review-bar\"><span>Los copywireframe · 5 november 2026 · geen aanvragen<\/span><label for=\"variant\">Vergelijk de kop<\/label><select id=\"variant\"><option value=\"0\">V0 · Laadgemak<\/option><option value=\"1\">V1 · Zonder oprit<\/option><option value=\"2\">V2 · Rijgevoel<\/option><option value=\"3\">V3 · Weekritme<\/option><option value=\"4\">V4 · Verder rijden<\/option><option value=\"5\">V5 · Eerlijke kosten<\/option><\/select><a href=\"index.html\">Alle pagina’s<\/a><\/div><header class=\"site-header\"><div class=\"headerline\"><a class=\"brand\" href=\"index.html\">Toyota De Bruyn<span>Machelen<\/span><\/a><a href=\"#voorbereiden\">Bereid je volgende stap voor<\/a><\/div><nav aria-label=\"Keuzehulp\"><a href=\"hybride-of-elektrisch.html\">Vergelijk aandrijvingen<\/a><a href=\"lez-brussel.html\">LEZ Brussel<\/a><a href=\"plug-in-hybride.html\">Plug-inhybride<\/a><a href=\"elektrisch-rijden.html\" aria-current=\"page\">Elektrisch rijden<\/a><a href=\"full-hybrid.html\">Full hybrid<\/a><a href=\"zakelijk-kiezen.html\">Zakelijk kiezen<\/a><\/nav><\/header><main id=\"inhoud\"><section class=\"hero\"><div><div class=\"hero-heading\"><h1 id=\"hero-title\">Laat je wagen laden terwijl je leven doorgaat.<\/h1><p id=\"hero-tagline\" class=\"tagline\">Thuis, op het werk of in de buurt: een goed laadplan maakt elektrisch rijden concreet.<\/p><\/div><p>Een stille start, directe reactie op het gaspedaal en geen benzinebeurt meer. Elektrisch rijden kan veel veranderen aan je dagelijkse rit. De praktische vraag is waar je de wagen oplaadt, tegen welke prijs en hoe dat in jouw leven past.<\/p><div class=\"actions\"><a class=\"button primary\" href=\"#laadplan\">Maak mijn laadplan<\/a><a class=\"button\" href=\"#kort\">Lees het korte antwoord<\/a><\/div><\/div><figure><img src=\"assets/hero.webp\" alt=\"Toyota C-HR+ op een kustweg\" width=\"800\" height=\"600\"><figcaption>Toyota C-HR+, volledig elektrisch. Afgebeelde uitvoering is geen voorraadbelofte.<\/figcaption><\/figure><\/section><div class=\"jump\" aria-label=\"Op deze pagina\"><a href=\"#kort\">Kort uitgelegd<\/a><a href=\"#deel-1\">Praktisch kiezen<\/a><a href=\"#vragen\">Veelgestelde vragen<\/a><a href=\"#bronnen\">Bronnen & actualiteit<\/a><\/div><section id=\"kort\" class=\"answer\"><h2>Elektrisch rijden: het korte antwoord<\/h2><p>Een volledig elektrische wagen (EV of BEV) rijdt op batterijstroom en heeft geen verbrandingsmotor. Een eigen oprit is niet verplicht: laden op het werk of publiek kan een oplossing zijn. Controleer wel beschikbaarheid, tarief, toegangstijden en een alternatief voordat je daarop rekent.<\/p><span class=\"source-inline\">Bronnen: <a href=\"#bron-S06\">Toyota België: opladen<\/a>, <a href=\"#bron-S08\">Toyota België: C-HR+<\/a>, <a href=\"#bron-S10\">Vlaanderen: publieke laadpaal aanvragen<\/a><\/span><\/section><section id=\"laadplan\" class=\"tool\"><h2>Maak ruimte voor laden in je gewone week.<\/h2><p>Een eenvoudige AC-laadplanning: hoeveel stroom vraagt je week en hoeveel aangesloten tijd zou dat vragen? Geen voorspelling van een snellaadsessie.<\/p><form id=\"ev-form\"><div class=\"form-grid\"><div><label for=\"place\">Waar laad je meestal?<\/label><select id=\"place\" name=\"place\"><option value=\"home\">Thuis<\/option><option value=\"work\">Op het werk<\/option><option value=\"public\">Publiek in de buurt<\/option><option value=\"unknown\">Nog niet duidelijk<\/option><\/select><\/div><div><label for=\"weekly\">Kilometers per week<\/label><input id=\"weekly\" name=\"weekly\" type=\"number\" value=\"300\" min=\"0\" max=\"5000\" step=\"any\" required inputmode=\"decimal\" aria-describedby=\"weekly-hint\"><small id=\"weekly-hint\">km/week<\/small><\/div><div><label for=\"meter\">Afgerekende stroom per 100 km<\/label><input id=\"meter\" name=\"meter\" type=\"number\" value=\"20\" min=\"0.1\" max=\"80\" step=\"any\" required inputmode=\"decimal\" aria-describedby=\"meter-hint\"><small id=\"meter-hint\">kWh/100 km, inclusief laadverliezen; voorbeeld<\/small><\/div><div><label for=\"power\">Gemiddeld effectief AC-laadvermogen<\/label><input id=\"power\" name=\"power\" type=\"number\" value=\"7.4\" min=\"0.1\" max=\"22\" step=\"any\" required inputmode=\"decimal\" aria-describedby=\"power-hint\"><small id=\"power-hint\">kW aan het laadpunt; laagste bruikbare vermogen van wagen, paal en aansluiting<\/small><\/div><\/div><button class=\"button primary\" type=\"submit\">Bereken mijn laadplanning<\/button><\/form><div id=\"ev-result\" class=\"result\" aria-live=\"polite\"><\/div><p class=\"small\">Formule: weekkilometers × afgerekende kWh/100 km ÷ 100, daarna delen door gemiddeld effectief kW. Vereenvoudigde planning; vermogensdeling, laadstops en batterijcondities kunnen meer tijd vragen. Geen installatieadvies.<\/p><\/section><section id=\"deel-1\"><h2>Begin bij waar je toch al parkeert.<\/h2><div class=\"editorial-list\"><article><h3>Thuis<\/h3><p>Laat een installateur de elektrische installatie, aansluitcapaciteit en geschikte laadoplossing beoordelen. Reken installatie en laadverliezen mee. Zonnestroom kan helpen, maar is niet automatisch gratis of beschikbaar op het uur dat je wilt laden.<\/p><\/article><article><h3>Op het werk<\/h3><p>Vraag naar het tarief, toegang buiten werkuren, het aantal beschikbare plekken en de afspraak bij een volle parking. Een laadpaal op het bedrijf betekent niet dat iedere medewerker er elke dag kan laden.<\/p><\/article><article><h3>In de buurt<\/h3><p>Ga kijken op de uren waarop je zou laden. Noteer wandelafstand, bezetting, parkeerregels en het tarief met je laadpas. Kies ook een tweede plek. Een kaartpin is nog geen gegarandeerde parkeerplaats.<\/p><\/article><\/div><\/section><section id=\"deel-2\"><h2>Rijbereik is een vertrekpunt. Geen belofte voor elke dag.<\/h2><p>De WLTP-waarde maakt uitvoeringen vergelijkbaar onder een testprocedure. Op jouw route spelen snelheid, temperatuur, verwarming, belading en banden mee. Vergelijk daarom ook een winterse snelwegrit en de reserve die je prettig vindt.<\/p><p>Voor een lange reis zijn laadlocatie, batterijtemperatuur en de laadcurve belangrijk. Het piekvermogen op de brochure zegt niet hoe lang elke laadstop duurt. Plan met de uitvoering die je overweegt, niet met het beste cijfer van het hele gamma.<\/p><\/section><section id=\"deel-3\"><h2>Geen eigen laadplek? Check wat er wél kan.<\/h2><p>In Vlaanderen bestaat een aanvraagroute voor een publieke laadpaal onder voorwaarden. Die route is bedoeld voor volledig elektrische voertuigen, niet voor PHEV’s. Gemeente, bestaande laadpunten en je parkeermogelijkheden spelen mee. Een aanvraag is geen gegarandeerd beschikbaar laadpunt op de dag van levering. <a class=\"reference\" href=\"#bron-S10\">[S10]<\/a><\/p><p>Woon of werk je in Brussel? Gebruik daar de bevoegde lokale informatie. De Vlaamse aanvraagvoorwaarden gelden niet automatisch in het Brussels Gewest. Plan de aankoop niet uitsluitend op basis van een nog niet bevestigde laadoplossing.<\/p><\/section><section id=\"deel-4\"><h2>Vergelijk een gewone maand, niet alleen één goedkope laadsessie.<\/h2><p>Gebruik een gewogen tarief voor thuis, werk, publieke palen en snelladers. Voeg sessie- of parkeerkosten apart toe als die van toepassing zijn. Voor de vergelijking telt de stroom die je afrekent, niet alleen wat er in de batterij aankomt.<\/p><p>Een Toyota C-HR+ is volledig elektrisch; de C-HR zonder plus kan een andere aandrijving hebben. Laat tijdens een proefrit ook laden en routeplanning zien. <a href=\"hybride-of-elektrisch.html#energie\">Bereken eerst je eigen energiescenario.<\/a><\/p><\/section><section id=\"vragen\"><h2>Wat je nog wilt weten.<\/h2><details><summary>Kan ik elektrisch rijden zonder thuis te laden?<\/summary><p>Ja, als je elders betrouwbaar kunt laden en de kosten en tijd passen. Test je laadplek op relevante uren en houd een alternatief achter de hand.<\/p><\/details><details><summary>Is elektrisch rijden altijd goedkoper?<\/summary><p>Nee. Energietarieven, verbruik, aanschaf, restwaarde en overige kosten bepalen samen de uitkomst. Publiek laden en snelladen kunnen een ander kostenbeeld geven dan thuisladen.<\/p><\/details><details><summary>Kan ik een gewoon stopcontact gebruiken?<\/summary><p>Laat eerst de installatie en een geschikte laadoplossing door een vakman beoordelen. Ga niet uit van een willekeurig stopcontact of verlengsnoer als dagelijkse laadvoorziening. Volg ook de voorschriften van de wagen.<\/p><\/details><details><summary>Wat gebeurt er met het rijbereik in de winter?<\/summary><p>Koude en verwarming kunnen je energiegebruik en bereik beïnvloeden. Hoeveel verschilt per wagen en omstandigheden. Reken met een realistisch winterscenario, niet met een universeel verliespercentage.<\/p><\/details><\/section><section id=\"voorbereiden\"><div class=\"prep-grid\"><div><h2>Een proefrit voor je gevoel. Een laadplan voor je week.<\/h2><p>Ervaar de elektrische aandrijving en leg je dagelijkse route ernaast. Breng ook je vragen over laden mee, zodat het plan niet bij de showroom stopt.<\/p><p><strong>Kom thuis bij een garage waar iedereen je kent.<\/strong><\/p><p>Bij De Bruyn in Machelen begint een goed gesprek bij wat jij nodig hebt, niet bij een afkorting.<\/p><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.toyotadebruyn.be/nl/about/machelen\">Bekijk de officiële contactpagina<\/a><p class=\"small\">Externe website. Deze proefpagina verstuurt zelf geen contact- of proefritaanvraag.<\/p><\/div><aside><h3>Neem dit mee.<\/h3><label><input type=\"checkbox\"> <span>Mijn hoofdlaadplek en toegangstijden<\/span><\/label><label><input type=\"checkbox\"> <span>Mijn alternatief wanneer de laadplek bezet is<\/span><\/label><label><input type=\"checkbox\"> <span>Tarief inclusief eventuele sessie- en parkeerkosten<\/span><\/label><label><input type=\"checkbox\"> <span>Mijn winterrit en langste terugkerende route<\/span><\/label><button id=\"prep-download\" type=\"button\">Download mijn voorbereiding<\/button><p class=\"small\">Vrij beschikbaar, zonder e-mailadres.<\/p><\/aside><\/div><\/section><section><h2>Verder met jouw keuze.<\/h2><div class=\"related\"><a href=\"hybride-of-elektrisch.html\">Vergelijk aandrijvingen<\/a><a href=\"plug-in-hybride.html\">Plug-inhybride<\/a><a href=\"lez-brussel.html\">LEZ Brussel<\/a><a href=\"zakelijk-kiezen.html\">Zakelijk kiezen<\/a><\/div><\/section><section id=\"bronnen\"><h2>Bronnen en actualiteit<\/h2><p class=\"small\">Inhoud gecontroleerd op 5 november 2026. Regelgeving, modellen en voorwaarden kunnen wijzigen. Dit is een redactioneel concept ter beoordeling door Toyota De Bruyn, geen definitief aanbod of individueel fiscaal/juridisch advies.<\/p><ol class=\"sources\"><li id=\"bron-S06\"><a href=\"https://nl.toyota.be/elektrische-modellen/opladen\" target=\"_blank\" rel=\"noopener noreferrer\">Toyota België: opladen<\/a><p>Laadmogelijkheden en praktische uitleg van Toyota België.<\/p><\/li><li id=\"bron-S08\"><a href=\"https://nl.toyota.be/modellen/toyota-c-hr-plus\" target=\"_blank\" rel=\"noopener noreferrer\">Toyota België: C-HR+<\/a><p>Belgische modelpagina voor de volledig elektrische C-HR+.<\/p><\/li><li id=\"bron-S10\"><a href=\"https://www.vlaanderen.be/mobiliteit-en-openbare-werken/duurzame-mobiliteit/milieuvriendelijke-voertuigen/publieke-laadpaal-aanvragen\" target=\"_blank\" rel=\"noopener noreferrer\">Vlaanderen: publieke laadpaal aanvragen<\/a><p>Aanvraagvoorwaarden voor een publieke laadpaal in Vlaanderen.<\/p><\/li><li id=\"bron-S20\"><a href=\"https://nl.toyota.be/elektrische-modellen/waar-en-hoe-opladen\" target=\"_blank\" rel=\"noopener noreferrer\">Toyota België: waar en hoe opladen<\/a><p>Laden en aandachtspunten voor een geschikte elektrische installatie.<\/p><\/li><\/ol><\/section><\/main><footer class=\"site-footer\"><strong>Toyota De Bruyn · Machelen<\/strong><a href=\"index.html\">Overzicht<\/a><span>Geen tracking of verzending van contactaanvragen in deze proef.<\/span><\/footer><script type=\"application/json\" id=\"variant-data\">[[\"Laadgemak\", \"Laat je wagen laden terwijl je leven doorgaat.\", \"Thuis, op het werk of in de buurt: een goed laadplan maakt elektrisch rijden concreet.\"], [\"Zonder oprit\", \"Geen eigen oprit. Wel elektrisch rijden?\", \"Bekijk of laden op het werk of in je buurt past bij je ritten én je rekening.\"], [\"Rijgevoel\", \"Stil vertrekken. Graag blijven rijden.\", \"Ontdek het elektrische rijgevoel en maak meteen een plan voor je laadmomenten.\"], [\"Weekritme\", \"De beste laadstop is degene die al in je dag past.\", \"Kijk eerst waar je wagen stilstaat. Daar begint jouw elektrische gebruiksgemak.\"], [\"Verder rijden\", \"Je wilt verder kijken dan het bereik op papier.\", \"Vergelijk gewone werkdagen, winterritten en vakanties met een haalbare laadroute.\"], [\"Eerlijke kosten\", \"Elektrisch rijden begint niet met een besparingsbelofte.\", \"Het begint met jouw tarieven, kilometers en een laadplek waarop je kunt rekenen.\"]]<\/script>", "full-hybrid.html": "<a class=\"skip\" href=\"#inhoud\">Ga naar inhoud<\/a><div class=\"review-bar\"><span>Los copywireframe · 5 november 2026 · geen aanvragen<\/span><label for=\"variant\">Vergelijk de kop<\/label><select id=\"variant\"><option value=\"0\">V0 · Zonder stekker<\/option><option value=\"1\">V1 · Dagelijks gemak<\/option><option value=\"2\">V2 · Rijgevoel<\/option><option value=\"3\">V3 · Geen laadplek<\/option><option value=\"4\">V4 · Helderheid<\/option><option value=\"5\">V5 · Vertrouwd<\/option><\/select><a href=\"index.html\">Alle pagina’s<\/a><\/div><header class=\"site-header\"><div class=\"headerline\"><a class=\"brand\" href=\"index.html\">Toyota De Bruyn<span>Machelen<\/span><\/a><a href=\"#voorbereiden\">Bereid je volgende stap voor<\/a><\/div><nav aria-label=\"Keuzehulp\"><a href=\"hybride-of-elektrisch.html\">Vergelijk aandrijvingen<\/a><a href=\"lez-brussel.html\">LEZ Brussel<\/a><a href=\"plug-in-hybride.html\">Plug-inhybride<\/a><a href=\"elektrisch-rijden.html\">Elektrisch rijden<\/a><a href=\"full-hybrid.html\" aria-current=\"page\">Full hybrid<\/a><a href=\"zakelijk-kiezen.html\">Zakelijk kiezen<\/a><\/nav><\/header><main id=\"inhoud\"><section class=\"hero\"><div><div class=\"hero-heading\"><h1 id=\"hero-title\">Gewoon tanken. Hybride rijden.<\/h1><p id=\"hero-tagline\" class=\"tagline\">Ontdek full hybrid: benzine en elektrische aandrijving, zonder laadkabel in je routine.<\/p><\/div><p>Je wilt graag prettig rijden, maar niet noodzakelijk je parkeer- en laadgewoonten veranderen. Een full hybrid combineert een benzinemotor met elektrische aandrijving en laadt zijn batterij tijdens het rijden. Dat verdient een eerlijke vergelijking, geen magische belofte.<\/p><div class=\"actions\"><a class=\"button primary\" href=\"#voorbereiden\">Bereid mijn hybrideproefrit voor<\/a><a class=\"button\" href=\"#kort\">Lees het korte antwoord<\/a><\/div><\/div><figure><img src=\"assets/yaris.webp\" alt=\"Toyota Yaris Cross op een kustweg\" width=\"800\" height=\"600\"><figcaption>Toyota Yaris Cross, een full-hybridmodel. Uitvoering en gebruik bepalen de concrete prestaties.<\/figcaption><\/figure><\/section><div class=\"jump\" aria-label=\"Op deze pagina\"><a href=\"#kort\">Kort uitgelegd<\/a><a href=\"#deel-1\">Praktisch kiezen<\/a><a href=\"#vragen\">Veelgestelde vragen<\/a><a href=\"#bronnen\">Bronnen & actualiteit<\/a><\/div><section id=\"kort\" class=\"answer\"><h2>Full hybrid: het korte antwoord<\/h2><p>Een full hybrid (HEV) gebruikt een verbrandingsmotor en een elektromotor, en kan onder geschikte omstandigheden ook kort elektrisch rijden. Je laadt hem niet met een kabel op. De batterij krijgt energie terug bij vertragen en remmen en kan via de benzinemotor worden geladen. Benzine blijft een energiebron.<\/p><span class=\"source-inline\">Bronnen: <a href=\"#bron-S04\">Toyota België: full-hybridtechnologie<\/a><\/span><\/section><section id=\"deel-1\"><h2>Zelf opladen betekent niet gratis energie.<\/h2><p>Bij vertragen kan energie worden teruggewonnen die anders deels verloren gaat. Ook de benzinemotor kan bijdragen aan het laden. Het systeem maakt geen energie uit het niets. Een full hybrid is dus niet volledig elektrisch en niet vrij van brandstofverbruik.<\/p><p>Hoe vaak je elektrisch rijdt en hoeveel je verbruikt, hangt af van de wagen, route, temperatuur en rijstijl. Gebruik geen algemeen percentage uit een reclame als voorspelling voor jouw maand.<\/p><\/section><section id=\"deel-2\"><h2>Mild hybrid, full hybrid en plug-in: niet hetzelfde.<\/h2><div class=\"table-wrap\"><table><caption>Wat het woord hybride wel en niet vertelt<\/caption><thead><tr><th scope=\"col\">Techniek<\/th><th scope=\"col\">Wat je moet weten<\/th><th scope=\"col\">Vraag bij de vergelijking<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Mild hybrid<\/th><td>Elektrische ondersteuning; mogelijkheden verschillen per systeem.<\/td><td>Kan deze uitvoering zelfstandig elektrisch rijden, en wanneer?<\/td><\/tr><tr><th scope=\"row\">Full hybrid<\/th><td>Kan onder geschikte omstandigheden ook elektrisch rijden, zonder externe laadbeurt.<\/td><td>Hoe voelt de overgang op mijn route?<\/td><\/tr><tr><th scope=\"row\">Plug-inhybride<\/th><td>Extern oplaadbare batterij naast de verbrandingsmotor.<\/td><td>Waar en hoe vaak ga ik laden?<\/td><\/tr><\/tbody><\/table><\/div><p>Laat de concrete technische fiche het verschil uitleggen. De badge op de achterkant is niet voldoende voor een volledige vergelijking.<\/p><\/section><section id=\"deel-3\"><h2>Vergelijk waar je rijdt, niet alleen hoeveel.<\/h2><p>Veel optrekken en vertragen is een ander gebruikspatroon dan een lange constante snelwegrit. Laat daarom je gewone woon-werkroute meewegen. Ook comfort, zicht, bediening en de beschikbare ruimte moeten passen.<\/p><p>Heb je inmiddels een goede laadplek? Zet dan ook PHEV en EV naast full hybrid. Geen kabel nodig hebben is een voordeel als dat bij je leven past, geen reden om andere mogelijkheden buiten beeld te houden.<\/p><\/section><section id=\"deel-4\"><h2>Maak de proefrit herkenbaar.<\/h2><ol class=\"steps\"><li><strong>Vertrek rustig.<\/strong> Voel de aandrijving bij parkeren en lage snelheid.<\/li><li><strong>Rijd je dagelijkse tempo.<\/strong> Test invoegen en een stuk snelweg, niet alleen de straat rond de showroom.<\/li><li><strong>Luister bij accelereren.<\/strong> Beoordeel het motorgeluid en de reactie zoals jij ze ervaart.<\/li><li><strong>Bekijk het verbruik in context.<\/strong> Een korte rit, koude motor of andere route maakt één cijfer slecht vergelijkbaar.<\/li><\/ol><\/section><section id=\"deel-5\"><h2>Ook zonder stekker blijven kosten en toegang belangrijk.<\/h2><p>Vergelijk de complete rekening: aanschaf of lease, waardeverlies, energie, onderhoud en belastingen. Voor tweedehands komen staat, onderhoud en batterij-informatie erbij. Vraag welke documenten op de specifieke wagen van toepassing zijn, zonder een algemene garantie te veronderstellen.<\/p><p>Een full hybrid krijgt niet automatisch onbeperkte LEZ-toegang of dezelfde fiscale behandeling als een EV. <a href=\"lez-brussel.html\">Controleer Brussel apart<\/a> en <a href=\"zakelijk-kiezen.html\">bekijk bij beroepsgebruik je belastingstelsel<\/a>.<\/p><\/section><section id=\"vragen\"><h2>Wat je nog wilt weten.<\/h2><details><summary>Moet ik een full hybrid opladen?<\/summary><p>Niet aan een externe laadpaal. De batterij wordt tijdens het gebruik geladen via energieterugwinning en de verbrandingsmotor. Je blijft benzine tanken.<\/p><\/details><details><summary>Kan ik er de hele dag elektrisch mee rijden?<\/summary><p>Dat is niet het uitgangspunt van een full hybrid. Elektrisch rijden gebeurt onder geschikte omstandigheden en over beperkte stukken. Wil je veel ritten op extern geladen stroom doen, vergelijk dan ook PHEV en EV.<\/p><\/details><details><summary>Is full hybrid altijd zuiniger op mijn route?<\/summary><p>Dat kun je niet uit de naam alleen afleiden. Vergelijk de exacte uitvoering, gelijksoortige routes en omstandigheden. Eén korte proefrit is geen betrouwbare voorspelling van een heel jaar.<\/p><\/details><details><summary>Welke Toyota kan ik als full hybrid bekijken?<\/summary><p>De Yaris Cross is een full-hybridvoorbeeld. Vraag naar actuele uitvoeringen en beschikbare proefritwagens. De beelden op deze pagina zijn geen actuele voorraadlijst.<\/p><\/details><\/section><section id=\"voorbereiden\"><div class=\"prep-grid\"><div><h2>Je hoeft niet alles van hybrides te weten om het verschil te voelen.<\/h2><p>Neem je gewone route en je dagelijkse spullen mee. Ontdek of de combinatie van aandrijving, comfort en gebruiksgemak voor jou klopt.<\/p><p><strong>Kom thuis bij een garage waar iedereen je kent.<\/strong><\/p><p>Bij De Bruyn in Machelen begint een goed gesprek bij wat jij nodig hebt, niet bij een afkorting.<\/p><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.toyotadebruyn.be/nl/about/machelen\">Bekijk de officiële contactpagina<\/a><p class=\"small\">Externe website. Deze proefpagina verstuurt zelf geen contact- of proefritaanvraag.<\/p><\/div><aside><h3>Neem dit mee.<\/h3><label><input type=\"checkbox\"> <span>Mijn gewone route met stad en snelweg<\/span><\/label><label><input type=\"checkbox\"> <span>Mijn huidige verbruik als vergelijkingspunt<\/span><\/label><label><input type=\"checkbox\"> <span>Mijn vragen over geluid, ruimte en bediening<\/span><\/label><label><input type=\"checkbox\"> <span>Mijn budget inclusief gebruikskosten<\/span><\/label><button id=\"prep-download\" type=\"button\">Download mijn voorbereiding<\/button><p class=\"small\">Vrij beschikbaar, zonder e-mailadres.<\/p><\/aside><\/div><\/section><section><h2>Verder met jouw keuze.<\/h2><div class=\"related\"><a href=\"hybride-of-elektrisch.html\">Vergelijk aandrijvingen<\/a><a href=\"plug-in-hybride.html\">Plug-inhybride<\/a><a href=\"elektrisch-rijden.html\">Elektrisch rijden<\/a><a href=\"lez-brussel.html\">LEZ Brussel<\/a><\/div><\/section><section id=\"bronnen\"><h2>Bronnen en actualiteit<\/h2><p class=\"small\">Inhoud gecontroleerd op 5 november 2026. Regelgeving, modellen en voorwaarden kunnen wijzigen. Dit is een redactioneel concept ter beoordeling door Toyota De Bruyn, geen definitief aanbod of individueel fiscaal/juridisch advies.<\/p><ol class=\"sources\"><li id=\"bron-S04\"><a href=\"https://nl.toyota.be/elektrische-modellen/hybride\" target=\"_blank\" rel=\"noopener noreferrer\">Toyota België: full-hybridtechnologie<\/a><p>Uitleg van Toyota België over hybridetechnologie.<\/p><\/li><li id=\"bron-S19\"><a href=\"https://nl.toyota.be/modellen/yaris-cross\" target=\"_blank\" rel=\"noopener noreferrer\">Toyota België: Yaris Cross<\/a><p>Belgische modelpagina voor de Yaris Cross full hybrid.<\/p><\/li><li id=\"bron-S06\"><a href=\"https://nl.toyota.be/elektrische-modellen/opladen\" target=\"_blank\" rel=\"noopener noreferrer\">Toyota België: opladen<\/a><p>Laadmogelijkheden en praktische uitleg van Toyota België.<\/p><\/li><\/ol><\/section><\/main><footer class=\"site-footer\"><strong>Toyota De Bruyn · Machelen<\/strong><a href=\"index.html\">Overzicht<\/a><span>Geen tracking of verzending van contactaanvragen in deze proef.<\/span><\/footer><script type=\"application/json\" id=\"variant-data\">[[\"Zonder stekker\", \"Gewoon tanken. Hybride rijden.\", \"Ontdek full hybrid: benzine en elektrische aandrijving, zonder laadkabel in je routine.\"], [\"Dagelijks gemak\", \"Je hebt al genoeg om aan te denken.\", \"Een full hybrid vraagt geen externe laadbeurt. Vergelijk of dat gemak bij jouw ritten past.\"], [\"Rijgevoel\", \"De techniek werkt samen. Jij voelt de rit.\", \"Ervaar hoe een full hybrid optrekt, vertraagt en schakelt tussen benzine en elektrisch.\"], [\"Geen laadplek\", \"Nog geen laadplek. Wel een volgende stap.\", \"Bekijk full hybrid naast de alternatieven, met je gebruik en budget als vertrekpunt.\"], [\"Helderheid\", \"Geen stekker. Geen magie. Wel slimme samenwerking.\", \"Begrijp waar de energie vandaan komt en wat een full hybrid voor jouw ritten kan betekenen.\"], [\"Vertrouwd\", \"Een andere manier van rijden. Een vertrouwde tankbeurt.\", \"Voel tijdens een proefrit of full hybrid de combinatie is die jij zoekt.\"]]<\/script>", "zakelijk-kiezen.html": "<a class=\"skip\" href=\"#inhoud\">Ga naar inhoud<\/a><div class=\"review-bar\"><span>Los copywireframe · 5 november 2026 · geen aanvragen<\/span><label for=\"variant\">Vergelijk de kop<\/label><select id=\"variant\"><option value=\"0\">V0 · Werkdag én rekening<\/option><option value=\"1\">V1 · Totaalbeeld<\/option><option value=\"2\">V2 · Rust<\/option><option value=\"3\">V3 · Continuïteit<\/option><option value=\"4\">V4 · Zelfstandige<\/option><option value=\"5\">V5 · Beslissen<\/option><\/select><a href=\"index.html\">Alle pagina’s<\/a><\/div><header class=\"site-header\"><div class=\"headerline\"><a class=\"brand\" href=\"index.html\">Toyota De Bruyn<span>Machelen<\/span><\/a><a href=\"#voorbereiden\">Bereid je volgende stap voor<\/a><\/div><nav aria-label=\"Keuzehulp\"><a href=\"hybride-of-elektrisch.html\">Vergelijk aandrijvingen<\/a><a href=\"lez-brussel.html\">LEZ Brussel<\/a><a href=\"plug-in-hybride.html\">Plug-inhybride<\/a><a href=\"elektrisch-rijden.html\">Elektrisch rijden<\/a><a href=\"full-hybrid.html\">Full hybrid<\/a><a href=\"zakelijk-kiezen.html\" aria-current=\"page\">Zakelijk kiezen<\/a><\/nav><\/header><main id=\"inhoud\"><section class=\"hero\"><div><div class=\"hero-heading\"><h1 id=\"hero-title\">Je wagen moet je werk vooruithelpen. Niet je vragen vergroten.<\/h1><p id=\"hero-tagline\" class=\"tagline\">Vergelijk aandrijving, laadplan en kosten. Met een aparte route voor eenmanszaak en vennootschap.<\/p><\/div><p>Een lage maandprijs zegt weinig als laden je planning doorkruist. En een aantrekkelijk aftrekpercentage zegt niet wat de wagen je werkelijk kost. Leg gebruik, cashuitgaven en fiscale behandeling naast elkaar voordat je beslist.<\/p><div class=\"actions\"><a class=\"button primary\" href=\"#zakelijk-plan\">Maak mijn zakelijke briefing<\/a><a class=\"button\" href=\"#kort\">Lees het korte antwoord<\/a><\/div><\/div><figure><img src=\"assets/dealer.webp\" alt=\"Toyota De Bruyn in Machelen\" width=\"800\" height=\"600\"><figcaption>Een zakelijke keuze begint bij je werkdag, niet bij één aftrekpercentage.<\/figcaption><\/figure><\/section><div class=\"jump\" aria-label=\"Op deze pagina\"><a href=\"#kort\">Kort uitgelegd<\/a><a href=\"#deel-1\">Praktisch kiezen<\/a><a href=\"#vragen\">Veelgestelde vragen<\/a><a href=\"#bronnen\">Bronnen & actualiteit<\/a><\/div><section id=\"kort\" class=\"answer\"><h2>Zakelijk kiezen: het korte antwoord<\/h2><p>Voor een zakelijke personenwagen moet je een eenmanszaak in de personenbelasting onderscheiden van een vennootschap. De PHEV-versoepeling in de personenbelasting is niet algemeen overdraagbaar naar vennootschappen. Laat de exacte wagen, bestel- of contractdatum en het beroepsgebruik toetsen. Vergelijk daarnaast de totale kosten en de praktische inzetbaarheid.<\/p><span class=\"source-inline\">Bronnen: <a href=\"#bron-S12\">FOD Financiën: fiscale nieuwigheden 2026<\/a>, <a href=\"#bron-S13\">ITAA: autofiscaliteit vennootschappen 2026<\/a>, <a href=\"#bron-S14\">Circulaire 2026/C/11: PHEV in personenbelasting<\/a><\/span><\/section><section id=\"zakelijk-plan\" class=\"tool\"><h2>Geef garage en accountant dezelfde briefing.<\/h2><p>Kies je situatie en neem de vragenlijst mee. Geen omzetgegevens, nummerplaat of persoonsgegevens nodig.<\/p><form id=\"business-form\"><div class=\"form-grid\"><div><label for=\"legal\">Mijn situatie<\/label><select id=\"legal\" name=\"legal\"><option value=\"sole\">Eenmanszaak / personenbelasting<\/option><option value=\"company\">Vennootschap<\/option><option value=\"employee\">Werknemer / wagenparkbeslisser<\/option><option value=\"unknown\">Nog te bevestigen<\/option><\/select><\/div><div><label for=\"timing\">Bestelling of contract<\/label><select id=\"timing\" name=\"timing\"><option value=\"new\">Nieuwe keuze, nog niet getekend<\/option><option value=\"old\">Bestaand contract of bestaande wagen<\/option><option value=\"unknown\">Datum of voorwaarden nog onduidelijk<\/option><\/select><\/div><div><label for=\"load\">Laadmogelijkheid<\/label><select id=\"load\" name=\"load\"><option value=\"yes\">Een bruikbare laadplek beschikbaar<\/option><option value=\"mixed\">Verschilt per bestuurder<\/option><option value=\"no\">Nog geen betrouwbare oplossing<\/option><\/select><\/div><\/div><button class=\"button primary\" type=\"submit\">Maak mijn briefing<\/button><\/form><div id=\"business-result\" class=\"result\" aria-live=\"polite\"><\/div><button type=\"button\" class=\"button\" id=\"business-download\" hidden>Download mijn zakelijke briefing<\/button><p class=\"small\">De download blijft op je toestel. Geen fiscaal percentage berekend, geen aanvraag verstuurd.<\/p><\/section><section id=\"deel-1\"><h2>Begin bij het belastingstelsel van je onderneming.<\/h2><div class=\"editorial-list\"><article><h3>Eenmanszaak<\/h3><p>Hier speelt de personenbelasting. De regeling voor plug-inhybrides kent specifieke bepalingen die niet simpelweg voor iedere hybride gelden. Laat de kostenposten, datum en voertuiggegevens afzonderlijk beoordelen. Een maximaal percentage is geen persoonlijk eindresultaat.<\/p><\/article><article><h3>Vennootschap<\/h3><p>Gebruik de regels voor de vennootschapsbelasting. Volgens de geraadpleegde ITAA-toelichting zijn de kosten van vanaf 2026 aangeschafte, gehuurde of geleasede thermische personenwagens, inclusief hybrides, niet meer aftrekbaar. Historische contracten en andere voertuigcategorieën vragen een eigen beoordeling.<\/p><\/article><article><h3>Werknemer of wagenpark<\/h3><p>Naast de werkgeverskosten spelen onder meer gebruiksafspraken, laadvergoeding en mogelijk voordeel alle aard voor de bestuurder. Laat finance en de bestuurders naar hetzelfde scenario kijken. Een gunstige bedrijfskost maakt de laadervaring nog niet werkbaar.<\/p><\/article><\/div><span class=\"source-inline\">Bronnen: <a href=\"#bron-S12\">FOD Financiën: fiscale nieuwigheden 2026<\/a>, <a href=\"#bron-S13\">ITAA: autofiscaliteit vennootschappen 2026<\/a>, <a href=\"#bron-S14\">Circulaire 2026/C/11: PHEV in personenbelasting<\/a><\/span><\/section><section id=\"deel-2\"><h2>Drie rekeningen die je niet mag verwarren.<\/h2><div class=\"table-wrap\"><table><caption>Van prijs naar een onderbouwde zakelijke afweging<\/caption><thead><tr><th scope=\"col\">Laag<\/th><th scope=\"col\">Wat hoort erin?<\/th><th scope=\"col\">Wat zegt het niet?<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Cashuitgaven<\/th><td>Aankoop of lease, energie, onderhoud, verzekering, laden en overige facturen.<\/td><td>Hoe de fiscus elke post behandelt.<\/td><\/tr><tr><th scope=\"row\">Fiscale verwerking<\/th><td>Beroepsgebruik, kostenaftrek, btw en eventueel voordeel alle aard.<\/td><td>Dat een aftrekbare uitgave gratis wordt.<\/td><\/tr><tr><th scope=\"row\">Totale gebruikskosten<\/th><td>Dezelfde looptijd en kilometers, inclusief restwaarde, diensten en relevante nevenkosten.<\/td><td>Dat de wagen praktisch bij iedere medewerker past.<\/td><\/tr><\/tbody><\/table><\/div><p>Reken aankoop en afschrijving niet dubbel. Vergelijk leasevoorstellen met dezelfde diensten en voorwaarden. Gebruik een energievergelijking als invoer, niet als volledige TCO-berekening.<\/p><\/section><section id=\"deel-3\"><h2>Een laadplan hoort bij het werkplan.<\/h2><p>Waar begint en eindigt de werkdag? Hoe voorspelbaar zijn de klantbezoeken? Kan de wagen laden terwijl hij toch stilstaat? Voor een EV telt ook de langste terugkerende werkrit. Voor een PHEV telt of bestuurders daadwerkelijk kunnen en willen laden.<\/p><p>Maak afspraken over de laadpas, thuisladen, declaraties, bezette laadpunten en vervangend vervoer. Dat zijn punten om vast te leggen, geen diensten die op deze pagina automatisch zijn inbegrepen. Bij bestelwagens verdienen laadvolume, nuttige lading en voertuigclassificatie een aparte vergelijking.<\/p><\/section><section id=\"deel-4\"><h2>Hetzelfde dossier voor garage en accountant.<\/h2><p>Vraag de garage om de exacte uitvoering, aandrijving, technische fiche, offerte en verwachte levering. Geef de accountant ook de bestel- of contractdatum, CO₂-meetgegevens, verwachte looptijd en verhouding privé/beroepsgebruik.<\/p><p>Laat daarna expliciet bevestigen welke kosten aftrekbaar zijn en welke btw-behandeling en bestuurderslasten gelden. Deze pagina rekent geen individueel fiscaal voordeel uit. Zo voorkom je dat een algemene slogan een contractbeslissing wordt.<\/p><\/section><section id=\"vragen\"><h2>Wat je nog wilt weten.<\/h2><details><summary>Is een PHEV in 2026 nog fiscaal interessant?<\/summary><p>Dat kan niet met één algemeen ja of nee. Onderscheid personenbelasting en vennootschapsbelasting en controleer contractdatum, voertuiggegevens en kostenpost. Laat een accountant jouw dossier doorrekenen.<\/p><\/details><details><summary>Betekent 100% aftrekbaar dat de wagen niets kost?<\/summary><p>Nee. Aftrekbaarheid gaat over de fiscale verwerking van een kost, niet over het terugbetalen van de hele factuur. Je cashuitgave, belastingsituatie en andere heffingen blijven relevant.<\/p><\/details><details><summary>Kan ik dezelfde regels gebruiken voor een bestelwagen?<\/summary><p>Niet zonder de voertuigclassificatie en het toepasselijke stelsel te controleren. De vergelijking op deze pagina gaat primair over personenwagens.<\/p><\/details><details><summary>Moet de offerte of de levering in een bepaald jaar vallen?<\/summary><p>De relevante datum moet per regeling worden vastgesteld. De geraadpleegde fiscale toelichting verwijst voor bepaalde autokosten naar bestelbon of lease-/huurcontract. Laat die datum bevestigen in plaats van alleen de levering te bekijken.<\/p><\/details><\/section><section id=\"voorbereiden\"><div class=\"prep-grid\"><div><h2>Een wagen die bij je zaak past. Een dossier dat te vergelijken valt.<\/h2><p>Neem je zakelijke briefing mee naar de garage en je accountant. Zo praten alle betrokkenen over dezelfde uitvoering, werkdag en kosten.<\/p><p><strong>Kom thuis bij een garage waar iedereen je kent.<\/strong><\/p><p>Bij De Bruyn in Machelen begint een goed gesprek bij wat jij nodig hebt, niet bij een afkorting.<\/p><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.toyotadebruyn.be/nl/about/machelen\">Bekijk de officiële contactpagina<\/a><p class=\"small\">Externe website. Deze proefpagina verstuurt zelf geen contact- of proefritaanvraag.<\/p><\/div><aside><h3>Neem dit mee.<\/h3><label><input type=\"checkbox\"> <span>Belastingstelsel en voertuigcategorie<\/span><\/label><label><input type=\"checkbox\"> <span>Bestel-/contractdatum en exacte uitvoering<\/span><\/label><label><input type=\"checkbox\"> <span>Jaarlijkse kilometers, looptijd en beroepsgebruik<\/span><\/label><label><input type=\"checkbox\"> <span>Laadplan, diensten en kosten per post<\/span><\/label><button id=\"prep-download\" type=\"button\">Download mijn voorbereiding<\/button><p class=\"small\">Vrij beschikbaar, zonder e-mailadres.<\/p><\/aside><\/div><\/section><section><h2>Verder met jouw keuze.<\/h2><div class=\"related\"><a href=\"hybride-of-elektrisch.html\">Vergelijk aandrijvingen<\/a><a href=\"elektrisch-rijden.html\">Elektrisch rijden<\/a><a href=\"plug-in-hybride.html\">Plug-inhybride<\/a><a href=\"lez-brussel.html\">LEZ Brussel<\/a><\/div><\/section><section id=\"bronnen\"><h2>Bronnen en actualiteit<\/h2><p class=\"small\">Inhoud gecontroleerd op 5 november 2026. Regelgeving, modellen en voorwaarden kunnen wijzigen. Dit is een redactioneel concept ter beoordeling door Toyota De Bruyn, geen definitief aanbod of individueel fiscaal/juridisch advies.<\/p><ol class=\"sources\"><li id=\"bron-S12\"><a href=\"https://fin.belgium.be/sites/default/files/media/documents/press-kit-fiscale-nieuwigheden-2026.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">FOD Financiën: fiscale nieuwigheden 2026<\/a><p>FOD Financiën over wijzigingen in de personenbelasting. Laat de toepassing op je dossier bevestigen.<\/p><\/li><li id=\"bron-S13\"><a href=\"https://www.itaa.be/wp-content/uploads/ITAA_A4-news_3-2026_NL.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">ITAA: autofiscaliteit vennootschappen 2026<\/a><p>ITAA-toelichting, maart 2026, pagina 29–30. Toets de actuele toepassing met je accountant.<\/p><\/li><li id=\"bron-S14\"><a href=\"https://fiscosearch.be/collecties/circulaires/circulaire-2026-c-11-over-de-aftrek-van-de-beroepskosten-van-oplaadbare-hybridevoertuigen\" target=\"_blank\" rel=\"noopener noreferrer\">Circulaire 2026/C/11: PHEV in personenbelasting<\/a><p>Reproductie van de FOD-circulaire van 7 januari 2026 bij Fiscosearch; afbakening van PHEV-regels in de personenbelasting.<\/p><\/li><\/ol><\/section><\/main>
